<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>نگاه اول</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="trials_sta.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   ارزیابی سریع اعتماد (STA) — بند الف-۵.۳ پیوست الف

   هر چهره ۵۰۰ میلی‌ثانیه نمایش داده می‌شود؛ این مدت برای پردازش
   ساختاری کامل چهره کافی است ولی اجازه تأمل کنترل‌شده نمی‌دهد.
   سپس اسلایدر ۰ تا ۱۰۰ ظاهر می‌شود و زمان واکنش از لحظه نمایش
   اسلایدر تا نخستین حرکت آن ثبت می‌گردد.

   محدودیت: زمان واکنش مرورگر تحت تأثیر تأخیر سخت‌افزار و نرم‌افزار
   است و «زمان تصمیم تقریبی» محسوب می‌شود؛ تحلیل‌های تأییدی مبتنی
   بر RT دقیق به فاز ۲ منتقل شده‌اند.
   ══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var b = Core.boot();
  if (!b) return;

  var S = Core.session();
  var form = S.cb_pre;                                   // STA فقط یک‌بار (پیش از مداخله) و با چهره‌های فرم پیش‌آزمون
  var trials = Core.shuffle(STA.forms[form]);
  var range = Core.barRange('sta.html');
  var calib = null;                                     // نتیجهٔ تمرین جهت اسلایدر
  var app = Core.$('#app');
  var idx = 0, responses = [];
  var log = new Core.Logger('sta');

  app.innerHTML = '<div class="center-screen"><div class="spinner"></div>' +
    '<p class="small">در حال آماده‌سازی…</p></div>';
  Core.preload(trials.map(function (t) { return Core.faceURL(t.face); })).then(intro);

  function intro() {
    app.innerHTML = '';
    var w = Core.el('div');
    w.appendChild(Core.el('h1', null, 'نگاه اول'));
    var p = Core.el('p', 'lead');
    p.textContent = 'چند عکس برای لحظه‌ای کوتاه نشان داده می‌شود. بعد از هر عکس، ' +
      'با یک خط‌کش می‌گویید چقدر احساس می‌کنید می‌شود به آن آدم اعتماد کرد.';
    w.appendChild(p);

    var card = Core.el('div', 'card');
    var ul = Core.el('ul', 'plain');
    [
      'هیچ جواب درستی وجود ندارد. اولین حسی که به شما دست می‌دهد کافی است.',
      'عکس‌ها خیلی سریع می‌آیند و می‌روند؛ فقط نگاه کنید.',
      'اول یک تمرین کوتاه با خط‌کش دارید. بعد ' + Core.fa(trials.length) + ' عکس است و کمتر از دو دقیقه طول می‌کشد.'
    ].forEach(function (t) { ul.appendChild(Core.el('li', null, t)); });
    card.appendChild(ul);
    w.appendChild(card);

    var btn = Core.el('button', 'btn', 'شروع');
    btn.type = 'button';
    btn.addEventListener('click', function () {
      this.disabled = true;
      app.innerHTML = '';
      calibrate();
    }, { once: true });
    var f = Core.el('div', 'footbar'), i = Core.el('div', 'inner');
    i.appendChild(btn); f.appendChild(i); w.appendChild(f);
    app.appendChild(w);
    window.scrollTo(0, 0);
  }

  /* ───────── تمرین جهت خط‌کش (کنترل جهت اسلایدر) ─────────
     پایلوت نشان داد برچسب‌های دو سرِ خط‌کش در صفحهٔ راست‌به‌چپ می‌تواند با جهت واقعی نوار ناهمخوان باشد.
     اکنون هر دو در یک جهت (LTR) هستند و پیش از شروع، دو تمرین صریح «روی ۰ بگذار / روی ۱۰۰ بگذار» اجرا می‌شود؛
     نتیجه (calib_ok) ثبت می‌شود تا هر فردِ احتمالاً گیج‌شده قابل‌شناسایی باشد. */
  function calibrate() {
    var steps = [{ want: 'اصلاً', lo: 0, hi: 15 }, { want: 'کاملاً', lo: 85, hi: 100 }];
    var k = 0, res = [];
    (function one() {
      if (k >= steps.length) { calib = { ok: res.every(function (r) { return r.ok_first; }) ? 1 : 0, res: res }; return fixation(); }
      var st = steps[k];
      app.innerHTML = '';
      var card = Core.el('div', 'card');
      card.appendChild(Core.el('div', 'q-text', 'تمرین ' + Core.fa(k + 1) + ' از ۲: دستگیره را روی «' + st.want + '» بگذارید'));
      var wrap = Core.el('div', 'slider-wrap');
      var val = Core.el('div', 'slider-val', '—');
      var input = Core.el('input'); input.type = 'range'; input.min = 0; input.max = 100; input.step = 1; input.value = 50;
      var ends = Core.el('div', 'slider-ends');
      ends.appendChild(Core.el('span', null, 'اصلاً (۰)')); ends.appendChild(Core.el('span', null, 'کاملاً (۱۰۰)'));
      wrap.appendChild(val); wrap.appendChild(input); wrap.appendChild(ends); card.appendChild(wrap);
      var msg = Core.el('div', 'note', ''); msg.style.display = 'none'; card.appendChild(msg);
      app.appendChild(card);
      var moved = false, tries = 0, firstVal = null;
      input.addEventListener('input', function () { moved = true; val.textContent = Core.fa(input.value); go.disabled = false; });
      var go = Core.el('button', 'btn', 'تأیید'); go.type = 'button'; go.disabled = true;
      var f = Core.el('div', 'footbar'), i = Core.el('div', 'inner'); i.appendChild(go); f.appendChild(i); app.appendChild(f);
      go.addEventListener('click', function () {
        var v = +input.value; tries++; if (firstVal === null) firstVal = v;
        if (v >= st.lo && v <= st.hi) { res.push({ want: st.want, first: firstVal, tries: tries, ok_first: tries === 1 }); k++; one(); }
        else { msg.style.display = 'block'; msg.textContent = 'دستگیره را باید تا انتهای «' + st.want + '» ببرید. دوباره امتحان کنید.'; }
      });
      window.scrollTo(0, 0);
    })();
  }

  /* نقطه تثبیت ۶۰۰ میلی‌ثانیه، سپس چهره */
  function fixation() {
    if (idx >= trials.length) return done();
    Core.setBarCount('عکس ' + Core.fa(idx + 1) + ' از ' + Core.fa(trials.length));
    Core.setBarFill(range[0] + (idx / trials.length) * (range[1] - range[0]));

    app.innerHTML = '<div class="center-screen"><div style="font-size:2.4rem">+</div></div>';
    setTimeout(showFace, 600);
  }

  function showFace() {
    var t = trials[idx];
    app.innerHTML = '';
    var stage = Core.el('div', 'stage');
    var box = Core.el('div', 'target-box');
    box.style.width = box.style.height = '190px';
    var im = Core.el('img');
    im.src = Core.faceURL(t.face);
    im.alt = '';
    box.appendChild(im);
    stage.appendChild(box);
    app.appendChild(stage);

    var onset = Core.now();
    setTimeout(function () { askRating(t, onset); }, CFG.STA_FACE_MS);
  }

  function askRating(t, onset) {
    app.innerHTML = '';
    var card = Core.el('div', 'card');
    card.appendChild(Core.el('div', 'q-text', 'چقدر حس می‌کنید می‌شود به این آدم اعتماد کرد؟'));

    var wrap = Core.el('div', 'slider-wrap');
    var val = Core.el('div', 'slider-val', '—');
    var input = Core.el('input');
    input.type = 'range';
    input.min = 0; input.max = 100; input.step = 1; input.value = 50;

    var ends = Core.el('div', 'slider-ends');
    ends.appendChild(Core.el('span', null, 'اصلاً'));
    ends.appendChild(Core.el('span', null, 'کاملاً'));

    wrap.appendChild(val);
    wrap.appendChild(input);
    wrap.appendChild(ends);
    card.appendChild(wrap);
    app.appendChild(card);

    var t0 = Core.now();
    var firstMove = null;
    var moves = 0;
    var answered = false;

    function onMove() {
      if (firstMove === null) firstMove = Core.now() - t0;
      moves++;
      answered = true;
      val.textContent = Core.fa(input.value);
      go.disabled = false;
    }
    input.addEventListener('input', onMove);

    var go = Core.el('button', 'btn', 'تأیید');
    go.type = 'button';
    go.disabled = true;
    var f = Core.el('div', 'footbar'), i = Core.el('div', 'inner');
    i.appendChild(go); f.appendChild(i); app.appendChild(f);

    var timer = CFG.TIMEOUT_STA > 0
      ? setTimeout(function () { record(true); }, CFG.TIMEOUT_STA) : null;
    go.addEventListener('click', function () { record(false); });

    var recorded = false;
    function record(timeout) {
      if (recorded) return;      // در برابر دو بار زدن سریع
      recorded = true;
      if (timer) clearTimeout(timer);
      responses.push({
        i: idx + 1,
        id: t.id,
        face: t.face,
        cond: t.r, gender: t.g, age_bin: t.age, exp_fsj: t.exp, form: form,
        rating: answered ? +input.value : null,
        rt_first_move_ms: firstMove,
        rt_confirm_ms: Core.now() - t0,
        n_moves: moves,
        face_onset_offset_ms: t0 - onset,
        timeout: timeout ? 1 : 0
      });
      log.mark('sta', { id: t.id, v: answered ? +input.value : null, rt: firstMove });
      idx++;
      fixation();
    }

    window.scrollTo(0, 0);
  }

  function done() {
    app.innerHTML = '<div class="center-screen"><div class="spinner"></div>' +
      '<p class="small">در حال ذخیره…</p></div>';

    function pick(c) {
      return responses.filter(function (r) { return r.cond === c && r.rating !== null; });
    }
    function mean(a, f) {
      return a.length ? a.reduce(function (s, r) { return s + f(r); }, 0) / a.length : null;
    }
    function sd(a, f) {
      if (a.length < 2) return null;
      var m = mean(a, f);
      return Math.sqrt(a.reduce(function (s, r) {
        return s + Math.pow(f(r) - m, 2);
      }, 0) / (a.length - 1));
    }

    var ME = pick('ME'), OT = responses.filter(function (r) { return r.cond !== 'ME' && r.rating !== null; });
    var rM = mean(ME, function (r) { return r.rating; });
    var rO = mean(OT, function (r) { return r.rating; });
    var tM = mean(ME, function (r) { return r.rt_first_move_ms || 0; });
    var tO = mean(OT, function (r) { return r.rt_first_move_ms || 0; });
    var out = {
      task_type: 'sta', sta_form: form, sta_version: STA.version, n_trials: responses.length,
      calib_ok: calib ? calib.ok : '', calib_json: JSON.stringify(calib ? calib.res : []),
      rating_ME: rM === null ? '' : +rM.toFixed(2), rating_other: rO === null ? '' : +rO.toFixed(2),
      diff_ME_minus_other: (rM !== null && rO !== null) ? +(rM - rO).toFixed(2) : '',
      RT_ME: tM === null ? '' : Math.round(tM), RT_other: tO === null ? '' : Math.round(tO),
      n_timeout: responses.filter(function (r) { return r.timeout; }).length,
      duration_ms: log.since(), trials_json: JSON.stringify(responses)
    };
    ['WH', 'BL', 'EA', 'HI'].forEach(function (c) {
      var m = mean(pick(c), function (r) { return r.rating; });
      out['rating_' + c] = m === null ? '' : +m.toFixed(2);
    });
    Core.finish('sta.html', out);
  }
})();
</script>
</body>
</html>
