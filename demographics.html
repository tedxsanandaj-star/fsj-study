<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>درباره شما</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>کمی درباره شما</h1>
  <p class="lead">هیچ‌کدام از این‌ها درست یا غلط ندارد. فقط برای توصیف کلی گروه شرکت‌کنندگان است.</p>
  <div id="form"></div>
</div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="items_misc.js"></script>
<script>
(function(){
  'use strict';
  var b = Core.boot();
  if (!b) return;

  Core.renderForm(Core.$('#form'), ITEMS.DEMOGRAPHICS, {
    section: 'demographics',
    number: false,
    onDone: function (ans) {
      var out = { task_type: 'demographics' };
      Object.keys(ans).forEach(function (k) {
        if (k === '_events') { out.events_json = JSON.stringify(ans[k]); return; }
        out[k] = ans[k];
      });
      Core.finish('demographics.html', out);
    }
  });
})();
</script>
</body>
</html>
